server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: careflow
  datasource:
    url: jdbc:h2:mem:careflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

careflow:
  clinic-name: Musterklinikum Nord
  sending-application: CAREFLOW
  receiving-application: LABSYS
