# Render Blueprint, Free-Plan. H2 im Speicher – keine Datenbankkosten.
services:
  - type: web
    name: careflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
